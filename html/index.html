<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre by GrK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div class="safe-body" id="safeBody">

            <!-- Parafusos -->
            <div class="bolt b1"></div>
            <div class="bolt b2"></div>
            <div class="bolt b3"></div>
            <div class="bolt b4"></div>

            <!-- Post-it com equação matemática -->
            <div class="postit" id="postit">
                <span class="postit-label">calcule a senha:</span>
                <span class="postit-eq" id="postitEq">45² - 4×√625 = ?</span>
            </div>

            <!-- Placa da marca -->
            <div class="brand-plate"><span>VAULT-TECH SEC.</span></div>

            <!-- Dial decorativo -->
            <div class="dial-row">
                <div class="dial-housing"><div class="dial-inner"></div></div>
            </div>

            <!-- Teclado numérico -->
            <div class="keypad-zone">
                <div class="display-screen">
                    <div class="display-text" id="display">PIN</div>
                </div>
                <div class="key-grid">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="pressKey('3')">3</button>
                    <button class="key-btn" onclick="pressKey('4')">4</button>
                    <button class="key-btn" onclick="pressKey('5')">5</button>
                    <button class="key-btn" onclick="pressKey('6')">6</button>
                    <button class="key-btn" onclick="pressKey('7')">7</button>
                    <button class="key-btn" onclick="pressKey('8')">8</button>
                    <button class="key-btn" onclick="pressKey('9')">9</button>
                    <button class="key-btn btn-c" onclick="clearPin()">CLR</button>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn btn-ok" onclick="checkPin()">OK</button>
                </div>
            </div>

            <!-- Volante -->
            <div class="wheel-zone">
                <div class="wheel-wrap" id="wheelWrap">
                    <svg class="wheel-svg" viewBox="0 0 130 130" id="wheelSvg">
                        <defs>
                            <radialGradient id="wheelGrad" cx="40%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#4a4a4a"/>
                                <stop offset="100%" stop-color="#111"/>
                            </radialGradient>
                            <radialGradient id="centerGrad" cx="35%" cy="35%" r="70%">
                                <stop offset="0%" stop-color="#7a6040"/>
                                <stop offset="100%" stop-color="#2a1a0a"/>
                            </radialGradient>
                        </defs>

                        <!-- Aro externo fixo -->
                        <circle cx="65" cy="65" r="58" fill="none" stroke="#1a1a1a" stroke-width="5"/>
                        <circle cx="65" cy="65" r="56" fill="none" stroke="#5a4a30" stroke-width="9" stroke-dasharray="12 4"/>
                        <circle cx="65" cy="65" r="50" fill="none" stroke="#222" stroke-width="3"/>

                        <!-- Indicador fixo vermelho -->
                        <polygon points="65,12 69,20 61,20" fill="#cc4400"/>

                        <!-- Grupo que gira -->
                        <g id="wheelGroup" style="transform-origin: 65px 65px;">
                            <circle cx="65" cy="65" r="48" fill="url(#wheelGrad)" stroke="#333" stroke-width="1.5"/>
                            <g stroke="#3a3a3a" stroke-width="7" stroke-linecap="round">
                                <line x1="65" y1="25" x2="65" y2="105"/>
                                <line x1="65" y1="25" x2="65" y2="105" transform="rotate(60 65 65)"/>
                                <line x1="65" y1="25" x2="65" y2="105" transform="rotate(-60 65 65)"/>
                            </g>
                            <g stroke="#555" stroke-width="3" stroke-linecap="round">
                                <line x1="65" y1="25" x2="65" y2="105"/>
                                <line x1="65" y1="25" x2="65" y2="105" transform="rotate(60 65 65)"/>
                                <line x1="65" y1="25" x2="65" y2="105" transform="rotate(-60 65 65)"/>
                            </g>
                            <circle cx="65" cy="65" r="20" fill="#1a1a1a" stroke="#3a3020" stroke-width="4"/>
                            <circle cx="65" cy="65" r="15" fill="url(#centerGrad)" stroke="#222" stroke-width="1.5"/>
                            <circle cx="65" cy="50" r="3" fill="#888"/>
                        </g>

                        <circle cx="65" cy="65" r="5" fill="#555" opacity="0.6"/>
                    </svg>
                </div>
            </div>

            <!-- Barra de progresso de giros -->
            <div class="progress-zone">
                <div class="progress-track">
                    <div class="progress-fill" id="wheelProgress"></div>
                </div>
                <span class="progress-label">3,5 VOLTAS</span>
            </div>

            <!-- Status -->
            <div class="status-bar">
                <span class="status-text" id="statusText">SISTEMA BLOQUEADO</span>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
